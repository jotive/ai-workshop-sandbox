<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tickets</title>
<style>
  :root {
    color-scheme: light dark;
    --border: #e2e5ea;
    --border-strong: #c7cdd6;
    --muted: #6b7280;
    --muted-2: #9aa2b1;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --accent: #2f5fe0;
    --accent-contrast: #ffffff;
    --danger: #d33a3a;
    --danger-bg: #fdecec;
    --danger-border: #f3c6c6;
    --high: #d33a3a;
    --medium: #b8710a;
    --low: #1f8a4c;
    --open: #2f5fe0;
    --closed: #6b7280;
    --radius: 10px;
    --radius-sm: 7px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 2px rgb(15 23 42 / 0.04), 0 1px 1px rgb(15 23 42 / 0.03);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --border: #2a2e37;
      --border-strong: #3a4048;
      --muted: #9aa2b1;
      --muted-2: #6b7280;
      --bg: #14161a;
      --card: #1c1f26;
      --text: #eceef1;
      --accent: #5b85ea;
      --accent-contrast: #0b0d10;
      --danger: #f0716a;
      --danger-bg: #2a1a1a;
      --danger-border: #4a2626;
      --high: #f0716a;
      --medium: #e0a341;
      --low: #4fbd7c;
      --open: #5b85ea;
      --closed: #9aa2b1;
      --shadow-card: 0 1px 2px rgb(0 0 0 / 0.3), 0 1px 1px rgb(0 0 0 / 0.2);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    margin: 0;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 1.375rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 0.2rem;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 1.75rem;
    font-size: 0.875rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.25rem;
    max-width: 1120px;
  }

  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
    body { padding: 1.25rem; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 1.25rem;
  }

  .card + .card { margin-top: 1rem; }

  .card h3 {
    margin: 0 0 1rem;
    font-size: 0.9rem;
    font-weight: 650;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
    color: var(--muted);
  }

  input, select, textarea {
    width: 100%;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    margin-bottom: 1rem;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }

  textarea { resize: vertical; min-height: 4.5rem; }

  input:hover, select:hover, textarea:hover { border-color: var(--muted-2); }

  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  ::placeholder { color: var(--muted-2); }

  button {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius-pill);
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    transition: transform 120ms var(--ease-out), opacity 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
  }

  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }

  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 0.4rem 0.85rem;
    font-size: 0.8rem;
    font-weight: 500;
  }

  button.secondary:hover { border-color: var(--danger); color: var(--danger); opacity: 1; }
  button.secondary:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
    margin-bottom: 1.1rem;
    flex-wrap: wrap;
  }

  .toolbar label { margin-bottom: 0.3rem; }
  .toolbar select { margin-bottom: 0; min-width: 10rem; }

  .stats {
    display: flex;
    gap: 0.6rem;
  }

  .stat-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 4.4rem;
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }

  .stat-tile .value {
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .stat-tile .label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .ticket {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.95rem 1.05rem;
    margin-bottom: 0.65rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    background: var(--card);
    transition: border-color 140ms var(--ease-out), opacity 140ms var(--ease-out);
  }

  .ticket:hover { border-color: var(--border-strong); }
  .ticket.closed { opacity: 0.6; }

  .ticket-title {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.25rem;
    letter-spacing: -0.005em;
  }

  .ticket-desc {
    font-size: 0.83rem;
    color: var(--muted);
    margin-bottom: 0.55rem;
    line-height: 1.45;
  }

  .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.15rem 0.55rem;
    border-radius: var(--radius-pill);
    color: white;
    letter-spacing: 0.01em;
  }

  .badge.high { background: var(--high); }
  .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); }
  .badge.status-open { background: var(--open); }
  .badge.status-closed { background: var(--closed); }

  .ticket-actions { flex-shrink: 0; }

  #error-banner {
    display: none;
    align-items: flex-start;
    gap: 0.6rem;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1.25rem;
    font-size: 0.85rem;
    max-width: 1120px;
  }

  #error-banner svg { flex-shrink: 0; margin-top: 0.1rem; }
  #error-banner .error-message { flex: 1; }

  #error-banner button {
    background: transparent;
    color: var(--danger);
    padding: 0.1rem 0.3rem;
    font-size: 0.85rem;
    line-height: 1;
  }

  .empty-state, .loading-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .empty-state svg { margin-bottom: 0.6rem; opacity: 0.5; }

  .loading-state .skeleton {
    height: 3.4rem;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--border) 0%, var(--card) 50%, var(--border) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
    margin-bottom: 0.65rem;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<h1>Tickets internos</h1>
<p class="subtitle">Sandbox de práctica — sin autenticación de usuarios, solo una API key compartida.</p>

<div id="error-banner" role="alert">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
    <path d="M8 4.5V8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="8" cy="11" r="0.9" fill="currentColor"/>
  </svg>
  <span class="error-message"></span>
  <button type="button" id="dismiss-error" aria-label="Cerrar aviso">&times;</button>
</div>

<div class="layout">
  <div>
    <div class="card">
      <label for="api-key">API key</label>
      <input id="api-key" type="text" placeholder="dev-local-key" />

      <label for="api-base" style="margin-bottom: 0.35rem;">API base URL</label>
      <input id="api-base" type="text" placeholder="http://localhost:8000" style="margin-bottom: 0;" />
    </div>

    <div class="card">
      <h3>Nuevo ticket</h3>
      <form id="create-form">
        <label for="title">Título</label>
        <input id="title" type="text" required maxlength="200" placeholder="¿Qué hay que resolver?" />

        <label for="description">Descripción</label>
        <textarea id="description" rows="3" maxlength="2000" placeholder="Detalle opcional"></textarea>

        <label for="priority">Prioridad</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <button type="submit">Crear ticket</button>
      </form>
    </div>
  </div>

  <div>
    <div class="card">
      <div class="toolbar">
        <div>
          <label for="filter-priority">Filtrar por prioridad</label>
          <select id="filter-priority">
            <option value="all">Todas</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="stats" id="stats" aria-live="polite"></div>
      </div>
      <div id="ticket-list">
        <div class="loading-state">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function apiBase() {
    return ($("api-base").value || "http://localhost:8000").replace(/\/$/, "");
  }

  function apiKey() {
    return $("api-key").value || "dev-local-key";
  }

  function restoreSettings() {
    $("api-base").value = localStorage.getItem("tickets.apiBase") || "http://localhost:8000";
    $("api-key").value = localStorage.getItem("tickets.apiKey") || "dev-local-key";
  }

  function persistSettings() {
    localStorage.setItem("tickets.apiBase", $("api-base").value);
    localStorage.setItem("tickets.apiKey", $("api-key").value);
  }

  async function apiFetch(path, options = {}) {
    const response = await fetch(`${apiBase()}${path}`, {
      ...options,
      headers: {
        "X-API-Key": apiKey(),
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${response.status})`);
    }
    return response.status === 204 ? null : response.json();
  }

  function showError(message) {
    const banner = $("error-banner");
    banner.querySelector(".error-message").textContent = message;
    banner.style.display = "flex";
  }

  function hideError() {
    $("error-banner").style.display = "none";
  }

  function emptyStateMarkup() {
    return `
      <div class="empty-state">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div>No hay tickets con este filtro.</div>
      </div>
    `;
  }

  function loadingStateMarkup() {
    return `
      <div class="loading-state">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    `;
  }

  function renderTicket(ticket) {
    const closed = ticket.status === "closed";
    const wrapper = document.createElement("div");
    wrapper.className = `ticket${closed ? " closed" : ""}`;
    wrapper.innerHTML = `
      <div>
        <div class="ticket-title">#${ticket.id} — ${ticket.title}</div>
        ${ticket.description ? `<div class="ticket-desc">${ticket.description}</div>` : ""}
        <div class="badges">
          <span class="badge ${ticket.priority}">${ticket.priority}</span>
          <span class="badge status-${ticket.status}">${ticket.status}</span>
        </div>
      </div>
    `;
    if (!closed) {
      const actions = document.createElement("div");
      actions.className = "ticket-actions";
      const closeButton = document.createElement("button");
      closeButton.textContent = "Cerrar";
      closeButton.className = "secondary";
      closeButton.onclick = () => closeTicket(ticket.id);
      actions.appendChild(closeButton);
      wrapper.appendChild(actions);
    }
    return wrapper;
  }

  async function loadTickets() {
    const priority = $("filter-priority").value;
    const query = priority === "all" ? "" : `?priority=${priority}`;
    const tickets = await apiFetch(`/tickets${query}`);
    const list = $("ticket-list");
    if (tickets.length === 0) {
      list.innerHTML = emptyStateMarkup();
      return;
    }
    list.innerHTML = "";
    tickets.forEach((ticket) => list.appendChild(renderTicket(ticket)));
  }

  async function loadStats() {
    const stats = await apiFetch("/stats");
    $("stats").innerHTML = `
      <div class="stat-tile"><span class="value">${stats.total}</span><span class="label">Total</span></div>
      <div class="stat-tile"><span class="value">${stats.open}</span><span class="label">Abiertos</span></div>
      <div class="stat-tile"><span class="value">${stats.closed}</span><span class="label">Cerrados</span></div>
    `;
  }

  async function refresh() {
    hideError();
    try {
      await Promise.all([loadTickets(), loadStats()]);
    } catch (error) {
      $("ticket-list").innerHTML = "";
      showError(error.message);
    }
  }

  async function closeTicket(id) {
    try {
      await apiFetch(`/tickets/${id}/close`, { method: "POST" });
      await refresh();
    } catch (error) {
      showError(error.message);
    }
  }

  $("create-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    hideError();
    try {
      await apiFetch("/tickets", {
        method: "POST",
        body: JSON.stringify({
          title: $("title").value,
          description: $("description").value,
          priority: $("priority").value,
        }),
      });
      event.target.reset();
      $("priority").value = "medium";
      await refresh();
    } catch (error) {
      showError(error.message);
    }
  });

  $("dismiss-error").addEventListener("click", hideError);
  $("filter-priority").addEventListener("change", refresh);
  $("api-key").addEventListener("change", () => { persistSettings(); refresh(); });
  $("api-base").addEventListener("change", () => { persistSettings(); refresh(); });

  restoreSettings();
  $("ticket-list").innerHTML = loadingStateMarkup();
  refresh();
</script>

</body>
</html>
